# BAMOS on HSSD ObjectNav (val) with teleport poses: servers/environment/hssd_server.py, environment/hssd_env.py,
# planning/hssd_runner.py, scripts/hssd/run.py. The model is the Isaac benchmark's (configs/isaac.yaml); this file sets the
# HSSD world. The constants below are the oracle channel's train fit (evaluation: val); runs take each channel's fit with
# scripts/hssd/run.py --fit results/hssd/calib/<channel>.
# budget 200 views (2026-10-09): success is read at every k <= 200 (anytime curves; ~13 benchmark actions per view, so
# 500 actions ~ 38 views); a run with a larger budget replays a smaller one's views exactly
experiment: {include_robot_start_view: true, additional_robot_view_budget: 200, forbid_exact_revisit: true,
  device: 'cuda:0', dtype: float64}
environment:
  backend: habitat
# the benchmark camera (objectnav_hssd-hab.yaml): 640 x 480, hfov 79, depth 0.5-5.0 m, 0.88 m above the navmesh point;
# 12 yaws (the benchmark's 30 deg turn), pitch 0 and -30 (its 30 deg tilt)
cameras:
  robot: {width: 640, height: 480, hfov_deg: 79.0, near_m: 0.5, far_m: 5.0,
    yaw_degrees: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330], pitch_degrees: [0, -30]}
# candidate cells 0.25 m (BeliefMapNav's voxel); the voxel belief on 0.1 m; depth rays every 4th pixel
mapping: {voxel_size_m: 0.25, grid_offset_m: 0.0, occupancy_voxel_m: 0.1,
  # fitted on train, v0.2.4 scene data, every floor's cells (scripts/hssd/calibrate.py occupancy; 214 episodes)
  occupancy_model: [0.06145, 0.8049, 0.0007591],
  occupancy_pixel_stride: 4, occupancy_ray_margin_m: 0.1,
  # depth nearer than 0.5 m (the benchmark sensor clips it): a hit at 0.5 m
  near_hits: true}
target: {center_stride_voxels: 1}
# fitted on train, v0.2.4 scene data (scripts/hssd/fit_constants.py, rule (a); 6413 frames of 214 episodes;
# eta_t and k at their bounds: the oracle is a step at a0); h_area0: the oracle's 150 valid-depth pixels of 640 x 480
detection_likelihood: {detection_gain: 0.999, false_positive_rate: 0.0184, h_area0: 0.0004883, h_slope: 100}
# size_grid_m is replaced by hssd.size_grid_by_category (per episode category)
planner: {tie_tolerance: 1.0e-12, ig_negative_tolerance: 1.0e-9, motion_scale_m: 5.0, utility_mode: ig,
  kappa_beta: 0.1896, kappa_lambda: 0.1638}  # the same train fit
stop: {success_radius_m: 0.5, tau_pi: 0.5, present_views: 1, mode: joint}
# success: the declared cell's centre within 0.5 m of a goal instance's box
evaluation: {max_center_error_m: 0.5}
# candidate cells 0.0-2.3 m above the floor
hssd: {pose_lattice_m: 0.5, sensor_height_m: 0.88, max_geodesic_m: 4.0, oracle_min_px: 150,
  candidate_band_m: [0.0, 2.3], workspace_top_m: 3.0}
# the noisy channels' false masks are no smaller than the oracle's DET threshold (150 px of 640 x 480)
# open-set detectors: every kept instance enters the DET update (multi-mask, formulation §8.2 extension; 2026-10-10: a
# house shows several objects of a category, and a model that confuses categories reports them side by side)
sensor_detector: {min_normalized_area: 0.000488, open_set_multi_mask: true}
