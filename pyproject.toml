[project]
name = "bamos"
version = "0.1.0"
description = "BAMOS — Bayesian Active Mask-based Object Search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "torch>=2.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bamos"
module-root = "src"
